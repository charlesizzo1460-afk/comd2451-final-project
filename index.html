<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Charles Izzo | Portfolio</title>
  <link rel="stylesheet" href="css/style.css">

<body>

  <header class="site-header">
    <h1>Charles Izzo</h1>
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="#gallery">Gallery</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section class="section" id="gallery">
      <h2>Gallery</h2>
      <div class="gallery">

        <figure class="gallery-item">
          <a href="assets/1point-300dpi.jpg">
            <img src="assets/1point-300dpi.jpg" alt="One-point perspective pencil drawing of a gallery room with framed portraits and display pedestals">
          </a>
          <figcaption>One-Point Perspective</figcaption>
        </figure>

        <figure class="gallery-item">
          <a href="assets/town-300dpi.jpg">
            <img src="assets/town-300dpi.jpg" alt="One-point perspective pencil drawing of a town street with houses and a subway train">
          </a>
          <figcaption>Town Street</figcaption>
        </figure>

        <figure class="gallery-item">
          <a href="assets/portrait-300dpi.jpg">
            <img src="assets/portrait-300dpi.jpg" alt="Charcoal self-portrait in a room with a thought cloud showing a car crash">
          </a>
          <figcaption>Portrait</figcaption>
        </figure>

        <figure class="gallery-item">
          <a href="assets/Vermont-300dpi.jpg">
            <img src="assets/Vermont-300dpi.jpg" alt="Greetings from Vermont postcard with skiers on a snowy mountain">

          <figcaption>Vermont Postcard</figcaption>

    <section class="section" id="contact">
